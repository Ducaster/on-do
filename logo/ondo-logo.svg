<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Warm gradient for the main circle -->
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8835A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D46A4E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C2544A;stop-opacity:1" />
    </linearGradient>

    <!-- Soft inner glow gradient -->
    <radialGradient id="innerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" style="stop-color:#F4A683;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#E8835A;stop-opacity:0" />
    </radialGradient>

    <!-- Temperature bar gradient -->
    <linearGradient id="tempGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#F4C8A0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8935A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4654E;stop-opacity:1" />
    </linearGradient>

    <!-- Subtle shadow -->
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C2544A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Main circle body - represents warmth and wholeness -->
  <circle cx="200" cy="175" r="120" fill="url(#warmGrad)" filter="url(#softShadow)"/>

  <!-- Inner glow - soft warm center -->
  <circle cx="200" cy="165" r="100" fill="url(#innerGlow)"/>

  <!-- Thermometer element integrated into the circle -->
  <!-- Thermometer tube -->
  <rect x="191" y="100" width="18" height="95" rx="9" fill="rgba(255,255,255,0.92)"/>

  <!-- Temperature fill inside tube -->
  <rect x="194" y="120" width="12" height="72" rx="6" fill="url(#tempGrad)"/>

  <!-- Thermometer bulb at bottom - also heart-shaped hint -->
  <circle cx="200" cy="205" r="26" fill="rgba(255,255,255,0.92)"/>
  <circle cx="200" cy="205" r="19" fill="#D4654E"/>

  <!-- Warm pulse rings emanating from center -->
  <circle cx="200" cy="205" r="30" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <circle cx="200" cy="205" r="42" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Temperature tick marks -->
  <line x1="212" y1="130" x2="218" y2="130" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="212" y1="145" x2="218" y2="145" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="212" y1="160" x2="218" y2="160" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="212" y1="175" x2="221" y2="175" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>

  <!-- Small decorative leaves/warmth wisps -->
  <path d="M155 130 Q145 115 155 105 Q160 118 170 125 Z" fill="rgba(255,255,255,0.2)"/>
  <path d="M240 120 Q250 105 245 95 Q238 108 230 118 Z" fill="rgba(255,255,255,0.2)"/>

  <!-- Typography: 온도 -->
  <text x="200" y="330" text-anchor="middle" font-family="'Noto Serif KR', 'Nanum Myeongjo', serif" font-size="52" font-weight="700" fill="#3D2B24" letter-spacing="12">온도</text>

  <!-- Typography: ON-DO -->
  <text x="200" y="362" text-anchor="middle" font-family="'Montserrat', 'Pretendard', sans-serif" font-size="16" font-weight="500" fill="#9B7B6B" letter-spacing="8">ON-DO</text>

  <!-- Tagline -->
  <text x="200" y="388" text-anchor="middle" font-family="'Noto Sans KR', 'Pretendard', sans-serif" font-size="9.5" font-weight="300" fill="#B8A090" letter-spacing="2">나에게 가장 편안한 마음의 온도</text>
</svg>
